      <header class="page-header">

        <h1>Get in touch</h1>

      </header>

      <section class="contact-grid">
        <div class="contact-card">
          <a class="contact-link" href="mailto:tmaxfinch6@gmail.com">
            <span>Email</span>
            <strong>tmaxfinch6@gmail.com</strong>

          <a class="contact-link" href="https://www.linkedin.com/in/max-finch-57001934a" target="_blank" rel="noreferrer">

        <form class="message-card" id="contact-form">
          <label>
            Name
            <input type="text" name="name" placeholder="Your name" autocomplete="name" />
          </label>
          <label>
            Email
            <input type="email" name="email" placeholder="you@email.com" autocomplete="email" />
          </label>
          <label class="full-field">
            Message
            <textarea name="message" rows="5" placeholder="What are you building?"></textarea>
          </label>
          <button class="button primary full-field" type="submit">Send Message</button>
        </form>
      </section>
